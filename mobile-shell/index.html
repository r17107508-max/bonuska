<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <title>ПроПлюшка</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
      }

      main {
        width: min(100%, 420px);
        text-align: center;
      }

      .mark {
        width: 88px;
        height: 88px;
        margin: 0 auto 20px;
        border-radius: 22px;
        display: grid;
        place-items: center;
        background: #0f766e;
        color: white;
        font-size: 40px;
        font-weight: 800;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        line-height: 1.15;
      }

      p {
        margin: 12px 0 0;
        color: #475569;
        line-height: 1.55;
      }

      a {
        margin-top: 22px;
        min-height: 48px;
        border-radius: 10px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        background: #0f766e;
        color: white;
        font-weight: 700;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">П</div>
      <h1>ПроПлюшка</h1>
      <p>QR-бонусы и подарки за покупки. Если приложение не открылось автоматически, проверьте интернет и повторите вход.</p>
      <a href="https://proplushka.ru">Открыть приложение</a>
    </main>
  </body>
</html>
